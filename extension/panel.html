<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabelSeek</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="app">
  <header class="head">
    <div class="top">
      <div class="titles">
        <h1 class="sr-only">LabelSeek</h1>
        <button type="button" id="pageBtn" class="page" title="Copy page URL">Loading…</button>
      </div>
      <button type="button" id="pauseBtn" class="pause" aria-label="Pause scanning" title="Pause scanning">
        <svg class="i-pause" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg>
        <svg class="i-play" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
      </button>
      <div class="menu-wrap">
        <button type="button" id="menuBtn" class="kebab" aria-label="More options" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </button>
        <div id="menu" class="menu" role="menu" aria-label="More options" hidden>
          <button type="button" role="menuitem" tabindex="-1" data-menu="copyAll" id="copyAll" class="mi">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            <span>Copy all issues</span>
          </button>
          <button type="button" role="menuitem" tabindex="-1" data-menu="refresh" class="mi">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            <span>Refresh</span>
          </button>
          <div role="separator" class="sep"></div>
          <button type="button" role="menuitem" tabindex="-1" data-menu="close" class="mi mi-2">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
            <span class="mi-text"><span class="mi-title">Close LabelSeek</span><span class="mi-sub">Stops scanning and clears highlights</span></span>
          </button>
        </div>
      </div>
    </div>

    <section aria-labelledby="statusHead">
      <h2 id="statusHead" class="sr-only">Filter by status</h2>
      <ul class="tiles">
        <li><button type="button" class="tile good" data-sev="good" aria-pressed="false"><span class="num" id="nGood">–</span><span class="lbl">Good</span><svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button></li>
        <li><button type="button" class="tile warn" data-sev="warn" aria-pressed="false"><span class="num" id="nWarn">–</span><span class="lbl">Warnings</span><svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button></li>
        <li><button type="button" class="tile err" data-sev="error" aria-pressed="false"><span class="num" id="nErr">–</span><span class="lbl">No name</span><svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button></li>
      </ul>
    </section>

    <div class="filter-row">
      <div id="chips" class="chips">
        <button type="button" id="searchOpen" class="circle" aria-label="Search elements">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
        </button>
        <div id="pills" class="pills" role="group" aria-label="Show"></div>
      </div>
      <div id="searchBox" class="search" hidden>
        <div class="search-field">
          <label for="find" class="sr-only">Search by name, role, attribute or selector</label>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4B5160" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
          <input id="find" type="search" placeholder="Name, role, attribute…" autocomplete="off" spellcheck="false">
        </div>
        <button type="button" id="searchClose" class="circle" aria-label="Close search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="pausedBanner" class="banner-wrap">
    <div class="banner-inner">
      <div class="banner">
        <span class="banner-text"><span class="banner-title">Scanning paused</span><span class="banner-body">Highlights are off and the page works normally, so you can click around or go to another page. The list below is from your last scan.</span></span>
        <button type="button" id="resumeBtn" class="btn primary small">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
          Resume scanning
        </button>
      </div>
    </div>
  </div>

  <main id="list" class="list" aria-label="Elements"></main>

  <div class="toast-wrap" role="status" aria-live="polite"><div id="toast" class="toast" hidden></div></div>

  <footer class="foot">
    <button type="button" id="exportCsv" class="btn primary">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
      Export CSV
    </button>
  </footer>
</div>
<script src="panel.js"></script>
</body>
</html>
